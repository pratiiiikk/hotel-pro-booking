# Render.com Infrastructure Blueprint
# Allows 1-click free tier deployment of both Backend Web Service and Frontend Static Site

services:
  # ---------------------------------------------------------------
  # 1. Backend API Web Service (Free Tier)
  # ---------------------------------------------------------------
  - type: web
    name: hotel-pro-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SENDER_EMAIL
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: REDIS_URL
        sync: false

  # ---------------------------------------------------------------
  # 2. Frontend React / Vite App (Free Static Site)
  # ---------------------------------------------------------------
  - type: web
    name: hotel-pro-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: hotel-pro-backend
          property: host
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: VITE_CURRENCY
        value: "$"
